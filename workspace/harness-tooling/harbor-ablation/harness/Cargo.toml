[package]
name = "gptgrep-harbor-ablation-exporter"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "gptgrep-harbor-prebuild"
path = "src/prebuild.rs"

[dependencies]
anyhow = "=1.0.104"
gptgrep-core = { path = "../../../../crates/gptgrep-core" }
gptgrep-jev = { path = "../../../../crates/gptgrep-jev" }
gptgrep-parse = { path = "../../../../crates/gptgrep-parse" }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
libc = "=0.2.189"

[dev-dependencies]
gptgrep-pageindex = { path = "../../../../crates/gptgrep-pageindex" }
tokio = { version = "=1.53.1", features = ["net", "io-util"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tempfile = "=3.27.0"

[patch."https://github.com/run-llama/liteparse"]
liteparse-pdfium = { path = "../../../../vendor/liteparse-pdfium" }

[[bin]]
name = "gptgrep-codex-native-agent"
path = "src/codex_agent.rs"

[[bin]]
name = "gptgrep-harbor-judge-request"
path = "src/judge_request.rs"

[[bin]]
name = "gptgrep-harbor-rich-helper"
path = "src/rich_helper.rs"
