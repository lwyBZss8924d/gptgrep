[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gptgrep-reef-adapter"
version = "0.1.0"
description = "Thin REEF candidate lifecycle bridge to GPTgrep's strict development controller"
requires-python = ">=3.13,<3.14"
dependencies = ["reef-infra"]

[tool.uv]
# Keep the pinned REEF source's SCM version rendering consistent across builds.
build-constraint-dependencies = ["setuptools-scm==10.3.4", "vcs-versioning==2.6.0"]

[tool.uv.sources]
reef-infra = { git = "https://github.com/Human-Agent-Society/reef.git", rev = "f773b6a6e769b5eb3884c1058e7da80b0b6862d1" }

[tool.hatch.build.targets.wheel]
packages = ["src/gptgrep_reef"]

# Derived from the pinned VCS installation's actual setuptools metadata. The
# constrained SCM backends above keep its Git version rendering repeatable and
# permit lock resolution with source builds disabled.
# Source pyproject SHA256: d57d1002fd4d7ec328e243c56394991ef110c4582ede508537b45a8cd1287800
# Version backend: setuptools-scm 10.3.4, vcs-versioning 2.6.0.
[[tool.uv.dependency-metadata]]
name = "reef-infra"
version = "0.1.4.dev77+gf773b6a6e"
requires-python = ">=3.12"
requires-dist = [
  "aiohttp>=3.14",
  "alembic<2,>=1.13",
  "huggingface_hub",
  "harbor<0.25,>=0.20",
  "pyyaml",
  "reef-client>=0.2.0",
  "reef-eval>=0.1.1",
  "sqlalchemy<3,>=2.0",
  "tomli-w",
  'httpx; extra == "sglang"',
  'requests; extra == "sglang"',
  'ray[default]; extra == "sglang"',
  'sglang-router>=0.3.2; extra == "sglang"',
  'psutil>=5.9; extra == "sglang"',
  'httpx; extra == "vllm"',
  'requests; extra == "vllm"',
  'ray[default]; extra == "vllm"',
  'psutil>=5.9; extra == "vllm"',
  'tinker==0.33.1; extra == "tinker"',
  'tinker-cookbook==0.5.7; extra == "tinker"',
  'jinja2>=3.1.0; extra == "tinker"',
  'psycopg[binary]<4,>=3.1; extra == "postgres"',
  'e2b>=2.46; extra == "e2b"',
  'connectrpc<0.13,>=0.11.1; extra == "e2b"',
  'wandb>=0.29.0; extra == "wandb"',
  'opentelemetry-sdk>=1.25; extra == "opentelemetry"',
  'opentelemetry-exporter-otlp-proto-http>=1.25; extra == "opentelemetry"',
  'e2b; extra == "slime"',
  'httpx[http2]; extra == "slime"',
  'memray; extra == "slime"',
  'omegaconf; extra == "slime"',
  'peft; extra == "slime"',
  'pillow; extra == "slime"',
  'psutil>=5.9; extra == "slime"',
  'pylatexenc; extra == "slime"',
  'qwen_vl_utils; extra == "slime"',
  'requests; extra == "slime"',
  'ray[default]; extra == "slime"',
  'safetensors; extra == "slime"',
  'sglang-router>=0.3.2; extra == "slime"',
  'tensorboard; extra == "slime"',
  'transformers; extra == "slime"',
  'wandb>=0.29.0; extra == "slime"',
  'mypy; extra == "dev"',
  'pre-commit; extra == "dev"',
  'pytest; extra == "dev"',
  'pytest-cov; extra == "dev"',
  'ruff==0.17.1; extra == "dev"',
]
provides-extra = ["sglang", "vllm", "tinker", "postgres", "e2b", "wandb", "opentelemetry", "slime", "dev"]
