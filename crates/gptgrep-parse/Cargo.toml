[package]
name = "gptgrep-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native plaintext and LiteParse document ingestion for GPTgrep"

[dependencies]
anyhow = "1"
gptgrep-pageindex = { path = "../gptgrep-pageindex" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
liteparse = { git = "https://github.com/run-llama/liteparse", rev = "ab8879623ee45a0b7a775d12b42a9a7ae9dab16b", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "fs", "time", "process", "sync"] }

zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
