[package]
name = "gptgrep-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded local Codex app-server workflows over GPTgrep evidence"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
bytes = "=1.12.1"
fs2 = "0.4"
gptgrep-core = { path = "../gptgrep-core" }
gptgrep-jev = { path = "../gptgrep-jev" }
gptgrep-parse = { path = "../gptgrep-parse" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "=2.6.1"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Some tests pause the clock so a deadline fires only once a deliberately hanging call is the only remaining work.
tokio = { version = "1", features = ["test-util"] }
