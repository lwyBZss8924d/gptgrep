[package]
name = "gptgrep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vectorless grep, document trees and Jev reranking for coding agents"

[[bin]]
name = "gptgrep"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gptgrep-core = { path = "../gptgrep-core" }
gptgrep-host = { path = "../gptgrep-host" }
gptgrep-pageindex = { path = "../gptgrep-pageindex" }
gptgrep-jev = { path = "../gptgrep-jev" }
gptgrep-parse = { path = "../gptgrep-parse" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
